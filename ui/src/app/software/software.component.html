<h4>{{ 'i18n_softwares' | translate }}</h4>
<div class="software-body">
    <form role="form">
        <label for="new-software-name" class="form-label">{{ 'i18n_software_name' | translate }}</label>
        <input type="text" id="new-software-name" class="form-control" [formField]="newSoftwareForm.name" />
        <button
            (click)="addSoftware()"
            [disabled]="newSoftwareForm.name().invalid()"
            class="btn btn-primary add-button"
            type="button"
        >
            {{ 'i18n_create_new' | translate }}
        </button>
    </form>
    <table class="table table-sm software-table">
        <thead>
            <tr>
                <th scope="col">{{ 'i18n_name' | translate }}</th>
                <th scope="col">{{ 'i18n_edit' | translate }}</th>
                <th scope="col">{{ 'i18n_remove' | translate }}</th>
            </tr>
        </thead>
        <tbody>
            @for (sw of software() | orderBy: 'name'; track sw.id) {
                <tr scope="row">
                    <td>
                        <div [hidden]="sw.showName">
                            {{ sw.name }}
                        </div>
                        @if (sw.showName) {
                            <form role="form">
                                <div class="input-group">
                                    <input
                                        type="text"
                                        class="form-control input-sm"
                                        name="accessibility-name"
                                        [(ngModel)]="sw.name"
                                        autofocus
                                    />
                                    <button
                                        type="button"
                                        class="input-group-text"
                                        (click)="toggleShowName(sw); updateSoftware(sw)"
                                    >
                                        {{ 'i18n_add' | translate }}
                                    </button>
                                </div>
                            </form>
                        }
                    </td>
                    <td>
                        <button
                            type="button"
                            class="icon-button"
                            [attr.aria-label]="('i18n_edit' | translate) + ' ' + sw.name"
                            (click)="toggleShowName(sw)"
                        >
                            <i class="bi-pencil" aria-hidden="true"></i>
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="icon-button"
                            [attr.aria-label]="('i18n_remove' | translate) + ' ' + sw.name"
                            (click)="removeSoftware(sw)"
                        >
                            <i class="sitnet-red bi-x" aria-hidden="true"></i>
                        </button>
                    </td>
                </tr>
            }
        </tbody>
    </table>
</div>
