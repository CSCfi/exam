<div class="xm-form-row">
    <span>
        {{ 'i18n_exam_editor_materials' | translate }}
        <sup
            ngbPopover="{{ 'i18n_exam_material_description' | translate }}"
            popoverTitle="{{ 'i18n_instructions' | translate }}"
            triggers="mouseenter:mouseleave"
            ><img src="/assets/images/icon_tooltip.svg" alt=""
        /></sup>
    </span>
    <div class="xm-cluster">
        <input
            type="text"
            class="form-control w-50"
            [ngModel]="filter()"
            (ngModelChange)="filter.set($event)"
            [ngbTypeahead]="filterMaterials$"
            (selectItem)="selectMaterial($event)"
            [resultFormatter]="nameFormat"
            [editable]="false"
        />
        <button (click)="addMaterial()" class="btn btn-success">
            {{ 'i18n_add' | translate }}
        </button>
        <button class="btn btn-sm btn-outline-secondary" (click)="openMaterialEditor()">
            {{ 'i18n_modify_materials' | translate }}
        </button>
    </div>
    <div class="xm-cluster">
        @for (material of section().examMaterials; track material) {
            <button
                class="btn btn-sm btn-light px-0"
                (click)="removeMaterial(material)"
                [ariaLabel]="'i18n_remove' | translate"
                title="{{ 'i18n_remove' | translate }}"
            >
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
        }
    </div>
</div>
