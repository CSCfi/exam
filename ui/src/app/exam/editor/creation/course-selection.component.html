<xm-page-header text="i18n_toolbar_new_exam" [history]="true" />
@if (exam()) {
    <xm-page-content [content]="content" />
}
<ng-template #content>
    <div class="xm-stack">
        <div class="xm-paragraph-title">{{ 'i18n_exam_title' | translate }}</div>
        <div class="xm-form-row">
            <span>
                {{ 'i18n_new_exam_type' | translate }}
                <sup
                    triggers="mouseenter:mouseleave"
                    popoverTitle="{{ 'i18n_instructions' | translate }}"
                    ngbPopover="{{ 'i18n_new_exam_type_description' | translate }}"
                >
                    <img src="/assets/images/icon_tooltip.svg" alt="" />
                </sup>
            </span>
            <span>{{ getExecutionTypeTranslation() | translate }}</span>
        </div>
        <xm-exam-course [exam]="exam()!" (updated)="onCourseSelected($event)"></xm-exam-course>
        <div class="xm-paragraph-title">{{ 'i18n_exam_title' | translate }}</div>
        <div>
            <label class="form-label" for="examName"
                >{{ 'i18n_exam_name' | translate }}
                <sup
                    ngbPopover="{{ 'i18n_exam_title_description' | translate }}"
                    popoverTitle="{{ 'i18n_instructions' | translate }}"
                    triggers="mouseenter:mouseleave"
                >
                    <img src="/assets/images/icon_tooltip.svg" alt="" />
                </sup>
            </label>
            <input
                id="examName"
                type="text"
                class="form-control w-50"
                [value]="exam()?.name ?? ''"
                (input)="onExamNameInput($event)"
                (keydown.enter)="$event.preventDefault()"
            />
        </div>
        <div>
            <label class="form-label" for="examLanguage">
                {{ 'i18n_exam_language' | translate }}
                <sup
                    ngbPopover="{{ 'i18n_exam_language_description' | translate }}"
                    popoverTitle="{{ 'i18n_instructions' | translate }}"
                    triggers="mouseenter:mouseleave"
                >
                    <img src="/assets/images/icon_tooltip.svg" alt="" />
                </sup>
            </label>
            @if (exam()) {
                <xm-language-picker
                    [exam]="exam()!"
                    id="examLanguage"
                    (updated)="updateExamLanguages($event)"
                ></xm-language-picker>
            }
        </div>
        <div class="editor-actions">
            <button class="btn btn-outline-secondary" (click)="cancelNewExam()" [hidden]="exam()?.state !== 'DRAFT'">
                {{ 'i18n_button_cancel' | translate }}
            </button>
            <button
                class="btn btn-success"
                [disabled]="!exam()?.course || !exam()?.name || (exam()?.examLanguages?.length ?? 0) < 1"
                (click)="continueToExam()"
            >
                {{ 'i18n_save' | translate }}
            </button>
        </div>
    </div>
</ng-template>
