<div cdkDrag [cdkDragConstrainPosition]="fixPosition" class="wrapper" [hidden]="shouldHide()">
    <div class="header" cdkDragHandle>
        <div>
            <button
                type="button"
                class="border-none background-none"
                (click)="toggleVisibility()"
                [ariaLabel]="(hideEditor() ? 'i18n_show' : 'i18n_hide') | translate"
                [ariaExpanded]="!hideEditor()"
                ngbPopover="{{ (hideEditor() ? 'i18n_show' : 'i18n_hide') | translate }}"
                triggers="mouseenter:mouseleave"
            >
                <i
                    [class.bi-chevron-right]="!hideEditor()"
                    [class.bi-chevron-down]="hideEditor()"
                    aria-hidden="true"
                ></i>
            </button>
        </div>
        <div>{{ title | translate }}</div>
    </div>
    <div [ngbCollapse]="hideEditor()" class="body" (mousedown)="$event.stopPropagation()">
        <div class="editor-area">
            <xm-ckeditor
                id="feedback-editor"
                [data]="editorContent"
                (dataChange)="commentChanged($event)"
                name="ck"
            ></xm-ckeditor>
        </div>
        @if (attachment()) {
        <div class="attachment">
            <button
                type="button"
                class="btn btn-link"
                (click)="downloadAttachment()"
                [ariaLabel]="'i18n_download_attachment' | translate"
            >
                {{ attachment()?.fileName }}
            </button>
            <button
                type="button"
                class="border-none background-none"
                (click)="removeAttachment()"
                [ariaLabel]="'i18n_remove_attachment' | translate"
            >
                <i class="bi-x text-danger" aria-hidden="true" title="{{ 'i18n_remove_attachment' | translate }}"></i>
            </button>
        </div>
        }
        <div class="footer">
            <button type="button" class="btn btn-outline-secondary" (click)="selectFile()">
                {{ 'i18n_attach_file' | translate }}
            </button>
            <button class="btn btn-outline-success" (click)="save()">{{ 'i18n_save' | translate }}</button>
        </div>
    </div>
</div>
