<form class="form">
    <div class="input-group">
        <input
            ngbDatepicker
            [attr.id]="inputId() ?? null"
            class="form-control"
            [disabled]="disabled()"
            [required]="!optional()"
            name="dp"
            [formField]="dateForm.date"
            #d="ngbDatepicker"
            [footerTemplate]="footerTemplate"
            [startDate]="startDate()"
            [minDate]="minDateStruct()"
            [maxDate]="maxDateStruct()"
            [readonly]="isReadonly()"
            [showWeekNumbers]="true"
            (dateSelect)="dateChange()"
            (blur)="dateChange()"
        />
        <div class="input-group-append">
            <button
                class="btn btn-success rounded-0 rounded-end"
                [disabled]="disabled()"
                (click)="d.toggle()"
                type="button"
                [ariaLabel]="'i18n_datepicker' | translate"
            >
                <img src="/assets/images/reservation_calendar.svg" alt="" />
            </button>
            <!-- extra btn -->
        </div>
    </div>
</form>
<ng-template #footerTemplate>
    <div class="date-picker-footer">
        <button class="btn btn-primary btn-sm" (click)="setDate(today()); d.close()">
            {{ 'i18n_today' | translate }}
        </button>
        <button class="btn btn-secondary btn-sm" (click)="dateCleared(); d.close()">
            {{ 'i18n_clear' | translate }}
        </button>
    </div>
</ng-template>
