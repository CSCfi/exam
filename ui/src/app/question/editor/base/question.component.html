<xm-page-header
    [text]="newQuestion() ? 'i18n_toolbar_new_question' : 'i18n_questions_edit'"
    [back]="!isModalContext()"
/>
<xm-page-content [content]="content" />

<ng-template #content>
    <form role="form" [formGroup]="questionForm" name="questionForm">
        @if (currentQuestion()) {
            <xm-question-body
                [question]="currentQuestion()!"
                [currentOwners]="currentOwners()"
                [lotteryOn]="lotteryOn()"
                [collaborative]="collaborative()"
                [questionTypes]="questionTypes"
                [newQuestion]="newQuestion()"
                (currentOwnersChange)="currentOwners.set($event)"
                (tagsChange)="onTagsChange($event)"
            ></xm-question-body>
        }
    </form>
    <div class="xm-cluster question-actions">
        <button (click)="cancel()" type="button" class="btn btn-secondary">
            {{ 'i18n_button_cancel' | translate }}
        </button>
        @if (currentQuestion()) {
            <button [disabled]="questionForm.invalid" (click)="saveQuestion()" type="submit" class="btn btn-success">
                {{ 'i18n_save' | translate }}
            </button>
        }
    </div>
</ng-template>
