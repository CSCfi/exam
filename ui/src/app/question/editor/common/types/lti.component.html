<div [formGroup]="ltiForm">
    <div class="row mt-3">
        <div class="col-md-3">
            {{ 'i18n_question_lti_id' | translate }}
            <sup
                ngbPopover="{{ 'i18n_question_lti_description' | translate }}"
                popoverTitle="{{ 'i18n_instructions' | translate }}"
                triggers="mouseenter:mouseleave"
            >
                <img src="/assets/images/icon_tooltip.svg" alt="" />
            </sup>
        </div>
        <div class="col-md-9 pe-0">
            <textarea
                id="ltiId"
                name="ltiId"
                class="form-control"
                rows="1"
                formControlName="ltiId"
                placeholder="{{ 'i18n_question_lti_id_instruction' | translate }}"
            >
            </textarea>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-3">
            {{ 'i18n_evaluation_type' | translate }}
        </div>
        <div class="col-md-3">
            <select
                id="evaluationType"
                name="evaluationType"
                class="form-select w-75"
                formControlName="defaultEvaluationType"
            >
                <option value="Points">{{ 'i18n_word_points' | translate }}</option>
            </select>
        </div>
    </div>
</div>
