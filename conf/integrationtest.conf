include "application.conf"

db.default.url = "jdbc:postgresql://localhost/exam_test"

play.mailer.host = localhost
play.mailer.port = 3025
play.mailer.ssl = no
play.mailer.tls = no
# Pin credentials so env (e.g. act/GitHub Actions SMTP_USER) does not override;
# avoids GreenMail "Mailbox X already exists" when many concurrent SMTP connections AUTH.
play.mailer.user = "user"
play.mailer.password = "password"

play.evolutions.db.default.autoApply = false
play.evolutions.db.default.enabled = false

exam.integration.enrolmentPermissionCheck.active = true

exam.integration.apiKey.enabled = true
exam.integration.apiKey.name = "X-Api-Key"
exam.integration.apiKey.value = "test-secret"

exam.attachments.path = "target/attachments"
# Local embedded Jetty server
exam.integration.courseUnitInfo.url = {
  default = "http://localhost:31245/courseUnitInfo?courseUnitCode=${course_code}"
  oulu.fi = "http://localhost:31245/courseUnitInfo/oulu?courseUnitCode=${course_code}"
}
exam.integration.iop.organisationRef = "test-org"
exam.integration.enrolmentPermissionCheck.url = "http://localhost:31246/enrolments?id=${employee_number}&lang=${employee_lang}"
exam.integration.iop.visit.active = true
exam.integration.iop.host = "http://localhost:31247"
exam.integration.iop.visit.restrict.homeOrganisations = ["funet.fi", "test.org"]
exam.integration.iop.visit.restrict.disallowExternal = true

play.filters.csrf.header.bypassHeaders {
  Csrf-Token = "nocheck"
}

exam.exam.anonymousReview = true
exam.user.studentIds.multiple.enabled = true
exam.user.studentIds.multiple.organisations = "org1.org,org2.org"

# LTI is off by default; the specs run with it on, apart from those checking it off.
lti.active = true

# An LTI tool shaped like a Moodle registration; application.conf ships none. The LTI specs
# launch against it, and test/lti/LtiIntegrationSpec adds an A+ tool next to it.
lti.tools.moodle {
  name = "Moodle"
  origin = "https://moodle.uni.org"
  client-id = "moodle-client"
  deployment-id = "moodle-deployment"
  initiate-login-url = ${lti.tools.moodle.origin}"/enrol/lti/login.php?id=registration-id"
  target-link-uri = ${lti.tools.moodle.origin}"/enrol/lti/launch.php"
  jwks-url = ${lti.tools.moodle.origin}"/enrol/lti/jwks.php"
  parameters = [{ name = "id", required = true }]
}
