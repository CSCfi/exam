include "application.conf"

play.mailer.mock = true

# Which login is in use, local development env, or HAKA
exam.login = "DEBUG"
exam.roles.admin = ["staff"]

exam.application.hostname = "http://localhost:4200"
exam.attachments.path = "data/attachments"
exam.integration.courseUnitInfo.url = {
  default = "http://localhost:34110/courses?courseCode=${course_code}"
}

exam.integration.iop.host = "http://localhost:3000"
exam.integration.iop.organisationRef = "define me in local.conf"
exam.integration.iop.visit.active = true
exam.integration.iop.collaboration.active = true
exam.integration.iop.visit.restrict.homeOrganisations = [] # change if wanting to test restrictions
exam.integration.iop.visit.restrict.disallowExternal = false

exam.multichoice.features.640.on = true

# LTI 1.3. Uncomment and point at your own registration to work on the LTI feature locally;
# see the LTI section of application.conf for what each value is. Note the issuer must be the
# backend directly rather than exam.application.hostname above: the Angular dev server proxies
# /app but not /integration, so a launch aimed at port 4200 would never reach the controller.
# Overriding lti.tool.origin alone cascades into the URLs derived from it in application.conf,
# so the three tool URLs below are only needed because Moodle sits under a /moodle500 prefix.
# lti.platform.issuer = "http://localhost:9000"
# lti.tool.origin = "http://moodle.local:8888"
# lti.tool.initiate-login-url = ${lti.tool.origin}"/moodle500/enrol/lti/login.php?id=<your published resource id>"
# lti.tool.jwks-url = ${lti.tool.origin}"/moodle500/enrol/lti/jwks.php"
# lti.platform.target-link-uri = ${lti.tool.origin}"/moodle500/enrol/lti/launch.php"
# lti.platform.client-id = "<the client id your Moodle issued>"
# lti.platform.deployment-id = "<the deployment id your Moodle issued>"
# lti.platform.key-id = "<any stable identifier for your key>"
# lti.platform.public-key = "data/lti/public_key.pem"
# lti.platform.private-key = "data/lti/private_key.pem"

play.filters.csrf.cookie.secure = false
play.filters.csrf.header.bypassHeaders = {
  X-Requested-With = "*"
  Csrf-Token = "nocheck"
}
exam.exam.anonymousReview = true

play.evolutions.autoApply = true
play.evolutions.autoApplyDowns = true

play.evolutions.db.default.autocommit = false

exam.byod.seb.active = true
exam.byod.home.active = true
