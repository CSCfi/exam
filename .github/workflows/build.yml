name: Build

on: [push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: exam_test
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 25
          distribution: temurin
          cache: sbt

      - name: Set up SBT
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Build UI and run tests
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run check-format
          pnpm run check-lint
          pnpm run build
          pnpm test --no-watch

      - name: Build backend and run tests
        run: |
          sed -i 's/\/var\/log\/exam/logs/g' $GITHUB_WORKSPACE/conf/logback.xml
          sbt scalafmtCheckAll "scalafixAll --check" test

      - name: Generate SPDX Bill of Rights
        # Using pipx run ensures the file is created on the host filesystem
        # with the correct permissions for the upload step.
        run: pipx run reuse spdx -o bill-of-rights.spdx

      - name: Upload SBOM as CI Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bill-of-rights
          path: bill-of-rights.spdx
          retention-days: 7

  release:
    # Only job with write access; runs no project or dependency code
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bill-of-rights

      - name: Publish Bill of Rights to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" bill-of-rights.spdx --clobber

  dependency-submission:
    # Sends the sbt dependency tree to GitHub's dependency graph for Dependabot alerts.
    # Alerts are only generated for the default branch, so other branches are skipped.
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 25
          distribution: temurin
          cache: sbt

      - name: Set up SBT
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Submit dependencies
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
        with:
          configs-ignore: test scala-tool scala-doc-tool

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        env:
          NGINX_CONFIG: nginx.conf  # Use HTTP config (no SSL certs in CI)
        run: |
          docker compose up -d
          echo "Containers starting..."
          sleep 5
          docker compose ps

      - name: Wait for postgres to be healthy
        run: |
          echo "Waiting for postgres..."
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U exam; do sleep 2; done'
          echo "✓ Postgres is ready"

      - name: Wait for exam backend to be healthy
        run: |
          echo "Waiting for exam backend..."
          timeout 120 bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" exam-app)" == "healthy" ]; do sleep 5; echo "Still waiting..."; done'
          echo "✓ Backend is ready"

      - name: Start and wait for nginx
        run: |
          echo "Starting nginx (depends on exam being healthy)..."
          docker compose up -d nginx
          
          echo "Waiting for nginx container to start..."
          timeout 30 bash -c 'until docker compose ps nginx | grep -q "Up"; do sleep 2; echo "Still waiting for nginx..."; done'
          echo "✓ Nginx container is up"
          
          echo "Waiting for nginx to be ready (testing endpoint)..."
          timeout 60 bash -c 'until curl -f -s http://localhost/ > /dev/null 2>&1; do echo "Nginx not ready yet..."; sleep 5; done'
          echo "✓ Nginx is responding"

      - name: Test application endpoints
        run: |
          echo "Testing root endpoint..."
          curl -f http://localhost/ || (echo "Failed to access root endpoint" && docker compose logs nginx && exit 1)
          echo "✓ Root endpoint works"
          
          echo "Testing API health check..."
          curl -f http://localhost/app/attributes || exit 1
          echo "✓ API endpoint works"
          
          echo "Testing CSRF token..."
          curl -v http://localhost/ 2>&1 | grep -q "XSRF-TOKEN" || exit 1
          echo "✓ CSRF token is set"
          
          echo "✓ All endpoint tests passed!"

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Postgres logs ==="
          docker compose logs postgres
          echo "=== Exam logs ==="
          docker compose logs exam
          echo "=== Nginx logs ==="
          docker compose logs nginx

      - name: Cleanup
        if: always()
        run: docker compose down -v
