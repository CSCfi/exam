name: Build

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: exam_test
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: sbt

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v6

      - name: Build UI and run tests
        run: |
          npm ci --ignore-scripts
          npm run check-format
          npm run check-lint
          npm run build
          npm test -- --no-watch

      - name: Build backend and run tests
        run: |
          sed -i 's/\/var\/log\/exam/logs/g' $GITHUB_WORKSPACE/conf/logback.xml
          sbt test

      - name: Generate SPDX Bill of Rights
        # Using pipx run ensures the file is created on the host filesystem
        # with the correct permissions for the upload step.
        run: pipx run reuse spdx -o bill-of-rights.spdx

      - name: Upload SBOM as CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bill-of-rights
          path: bill-of-rights.spdx
          retention-days: 7

  release:
    # Only job with write access; runs no project or dependency code
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bill-of-rights

      - name: Publish Bill of Rights to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" bill-of-rights.spdx --clobber

  dependency-submission:
    # Sends the sbt dependency tree to GitHub's dependency graph for Dependabot alerts.
    # Alerts are only generated for the default branch, so other branches are skipped.
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: 21
          distribution: temurin
          cache: sbt

      - name: Set up SBT
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Submit dependencies
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
        with:
          configs-ignore: test scala-tool scala-doc-tool
