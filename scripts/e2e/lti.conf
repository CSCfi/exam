# LTI for the GUI tests (included by app.conf): the stand-in tool of lti-tool/server.mjs, which
# run.sh starts on https://127.0.0.1:8443, a different site from EXAM's http://localhost. The keys
# are generated by run.sh into scripts/e2e/.lti and mounted by compose.yml.
lti.active = true
lti.platform.issuer = "http://localhost"
lti.platform.key-id = "e2e-key"
lti.platform.public-key = "/app/lti/platform-public.pem"
lti.platform.private-key = "/app/lti/platform-private.pem"
lti.tools.e2e {
  name = "E2E tool"
  origin = "https://127.0.0.1:8443"
  client-id = "e2e-client"
  deployment-id = "e2e-deployment"
  initiate-login-url = ${lti.tools.e2e.origin}"/login"
  target-link-uri = ${lti.tools.e2e.origin}"/launch"
  parameters = [{ name = "id", required = true }]
}
