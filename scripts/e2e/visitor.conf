# Copied into the app container by the visitor test (tests/student-exam-day.spec.ts), which then
# restarts the app (support/stack.ts, included by app.conf). The DEBUG login always makes the eppn
# <username>@funet.fi, so with a home organisation list that leaves out funet.fi, every user
# counts as a visitor from another organisation.
exam.integration.iop.visit.restrict.homeOrganisations = ["e2e.invalid"]
