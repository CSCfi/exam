#
# Compose override used by run.sh only (COMPOSE_FILE). The app starts with -Dconfig.file pointing
# at /app/conf/docker.conf; here that path gets app.conf, which includes the real docker.conf and
# then the tests' LTI setup and optional overrides. Relative paths resolve against the repository root.
services:
  exam:
    volumes:
      - ./conf/docker.conf:/app/conf/docker-base.conf:ro
      - ./scripts/e2e/app.conf:/app/conf/docker.conf:ro
      - ./scripts/e2e/lti.conf:/app/conf/e2e-lti.conf:ro
      # LTI signing keys, generated by run.sh
      - ./scripts/e2e/.lti:/app/lti:ro
